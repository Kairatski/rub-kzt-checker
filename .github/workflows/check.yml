name: check-rate

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call bot check endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: curl -fsS -m 30 -H "Authorization: Bearer $CRON_SECRET" https://rub-kzt-bot.vercel.app/api/check
